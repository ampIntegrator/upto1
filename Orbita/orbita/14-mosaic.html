<!DOCTYPE html>
<html lang="fr" data-theme="blue">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbita — mosaïque cards + images</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Schibsted+Grotesk:wght@500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="orbita.css" />
  <link rel="stylesheet" href="icons.css" />
  <script src="icons.js"></script>
  <style type="text/tailwindcss">
    @theme inline {
      --font-sans: "Geist", system-ui, sans-serif;
      --font-serif: "Cormorant Garamond", serif;
      --font-display: "Schibsted Grotesk", system-ui, sans-serif;
      --font-mono: "Geist Mono", monospace;
      --color-bg: var(--bg); --color-bg-2: var(--bg-2); --color-paper: var(--paper);
      --color-ink: var(--ink); --color-ink-2: var(--ink-2); --color-ink-3: var(--ink-3);
      --color-line: var(--line); --color-line-2: var(--line-2);
      --color-primary: var(--primary); --color-primary-deep: var(--primary-deep); --color-primary-soft: var(--primary-soft);
      --color-editorial: var(--editorial); --color-highlight: var(--highlight); --color-night: var(--night);
    }
  </style>
  <style>
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Geist",system-ui,sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }    @media (prefers-reduced-motion:reduce){ .card-sep i { animation:none; } }    /* ===== panneau image plein cadre (colonne) ===== */
    .imgpanel { position:relative; min-height:280px; background-size:cover; background-position:center;
      background-repeat:no-repeat; background-color:#1B2238; }    /* liseré accent en pied (identique au composant 13) */
    .imgpanel::after { content:''; position:absolute; left:0; right:0; bottom:0; height:4px;
      background:linear-gradient(90deg, var(--primary) 0%, var(--highlight) 50%, var(--primary) 100%); }
  </style>
</head>
<body data-theme="blue">

  <!-- reserved header space — dark + accent switcher -->
  <div class="flex items-center h-[112px] bg-night">
    <div class="max-w-[1280px] mx-auto px-5 sm:px-8 w-full flex items-center justify-end gap-6">
      <div class="flex items-center gap-2" id="siloSwitch">
        <span class="font-mono text-[11px] tracking-[.14em] uppercase mr-1 text-white/40">Accent</span>
        <button class="silo-btn" data-silo="blue">Bleu</button>
        <button class="silo-btn" data-silo="green">Vert</button>
        <button class="silo-btn" data-silo="orange">Orange</button>
        <button class="silo-btn" data-silo="violet">Violet</button>
        <button class="silo-btn" data-silo="brique">Brique</button>
        <button class="silo-btn" data-silo="magenta">Magenta</button>
        <button class="silo-btn" data-silo="ambre">Ambre</button>
      </div>
    </div>
  </div>

  <!-- ===================== RANGÉE 1 · image + 2 cards icône (33 / 33 / 33) ===================== -->
  <section class="py-14 sm:py-20">
    <div class="max-w-[1280px] mx-auto px-5 sm:px-8">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 items-stretch">
        <div class="imgpanel sm:col-span-2 lg:col-span-1" style="background-image:url('https://images.unsplash.com/photo-1503387762-592deb58ef4e?q=80&w=1100&auto=format&fit=crop');"></div>
        <div id="r1c2"></div>
        <div id="r1c3"></div>
      </div>
    </div>
  </section>

  <div class="h-[200px] bg-night"></div>

  <!-- ===================== RANGÉE 2 · card chiffre + image + card titre (25 / 50 / 25) ===================== -->
  <section class="py-14 sm:py-20">
    <div class="max-w-[1280px] mx-auto px-5 sm:px-8">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 items-stretch">
        <div id="r2c1"></div>
        <div class="imgpanel sm:col-span-2 lg:col-span-2" style="background-image:url('https://images.unsplash.com/photo-1541888946425-d81bb19240f5?q=80&w=1300&auto=format&fit=crop');"></div>
        <div id="r2c3"></div>
      </div>
    </div>
  </section>

  <div class="h-[200px] bg-night"></div>

  <!-- ===================== RANGÉE 3 · image + card texte (50 / 50) ===================== -->
  <section class="py-14 sm:py-20">
    <div class="max-w-[1280px] mx-auto px-5 sm:px-8">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 items-stretch">
        <div class="imgpanel" style="background-image:url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1300&auto=format&fit=crop');"></div>
        <div id="r3c2"></div>
      </div>
    </div>
  </section>

  <div class="h-[200px] bg-night"></div>

  <!-- ===================== RANGÉE 4 · image large + card icône (66 / 33) ===================== -->
  <section class="py-14 sm:py-20">
    <div class="max-w-[1280px] mx-auto px-5 sm:px-8">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 items-stretch">
        <div class="imgpanel sm:col-span-2" style="background-image:url('https://images.unsplash.com/photo-1504307651254-35680f356dfd?q=80&w=1500&auto=format&fit=crop');"></div>
        <div id="r4c2"></div>
      </div>
    </div>
  </section>

  <script>
    const ICONS = { check:'gauge', chart:'chart', doc:'doc', shield:'shield' };
    const arw = '<o-icon name="arrow-right" size="16"></o-icon>';
    const LOREM = "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore.";
    const LOREM_LONG = "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo.";

    /* châssis identique au composant 12 — média + titre + texte + CTA en bas.
       h-full pour remplir la cellule étirée (hauteurs alignées dans la rangée). */
    function card(media, title, text, cta, opts){
      opts = opts || {};
      const titleCls = opts.accentTitle ? 'text-primary' : 'text-ink';
      const sep = '<div class="card-sep"><i></i></div>';
      return `
      <div class="card-i h-full bg-paper border border-line flex flex-col">
        <div class="p-6 flex flex-col flex-1">
          ${media.html}
          <h3 class="text-[18px] font-bold ${titleCls} text-center mb-2.5 mt-0">${title}</h3>
          ${sep}
          <p class="text-[14px] leading-[1.6] text-ink-2 text-left flex-1 m-0 mb-5">${text}</p>
        </div>
        <a class="card-cta flex items-center justify-between px-6 py-4 border-t border-line no-underline text-[13.5px] font-semibold" href="#">
          <span class="whitespace-nowrap">${cta}</span>${arw}
        </a>
      </div>`;
    }
    const noMedia   = { html:'' };
    const iconMedia = name => ({ html:`<span class="inline-flex items-center justify-center w-16 h-16 mb-7 bg-primary-soft text-primary self-center"><o-icon name="${name}" size="28"></o-icon></span>` });
    const numMedia  = n => ({ html:`<div class="card-num text-center mb-4">${n}</div>` });

    /* ---- RANGÉE 1 : 2 cards icône ---- */
    document.getElementById('r1c2').innerHTML = card(iconMedia(ICONS.check), 'Chiffrage instantané', LOREM, 'En savoir plus');
    document.getElementById('r1c3').innerHTML = card(iconMedia(ICONS.chart), 'Suivi des coûts',      LOREM, 'En savoir plus');

    /* ---- RANGÉE 2 : card chiffre + card titre seul ---- */
    document.getElementById('r2c1').innerHTML = card(numMedia('1 000<span class="sign"> m²</span>'), 'Seuil d\'application', LOREM, 'En savoir plus');
    document.getElementById('r2c3').innerHTML = card(noMedia, 'Sans engagement', LOREM, 'En savoir plus', { accentTitle:true, sep:true });

    /* ---- RANGÉE 3 : card texte (50%) ---- */
    document.getElementById('r3c2').innerHTML = card(noMedia, 'Le chiffrage adapté à votre métier', LOREM_LONG, 'Découvrir la méthode');

    /* ---- RANGÉE 4 : card icône (33%) ---- */
    document.getElementById('r4c2').innerHTML = card(iconMedia(ICONS.shield), 'Validation expert', LOREM, 'En savoir plus');

    /* ---- accent switcher ---- */
    const root = document.documentElement, body = document.body;
    const siloBtns = [...document.querySelectorAll('#siloSwitch .silo-btn')];
    function setSilo(s){
      root.setAttribute('data-theme', s); body.setAttribute('data-theme', s);
      siloBtns.forEach(b => b.classList.toggle('is-active', b.dataset.silo === s));
    }
    siloBtns.forEach(b => b.addEventListener('click', () => setSilo(b.dataset.silo)));
    setSilo('blue');
  </script>
</body>
</html>
